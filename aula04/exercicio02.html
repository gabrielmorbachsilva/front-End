<!DOCTYPE html>
<html>

<head>
  <meta charset=“UTF-8”>
  <meta name=“viewport” content=“width=device-width, initial-scale=1.0”>
  <title>Document</title>
</head>

<body>
  <script>
    
   let letra = "";

    do {
      letra = prompt("Digite (F) para feminino e (M) para masculino: ");
      if (letra === "f") {
        alert("Você digitou feminino");
      } else if (letra === "m") {
        alert("Você digitou masculino");
      } else{
        alert("Resposta errada! Digite 'F' ou 'M'");
      }
    } while (letra != "f" && letra != "m");
      
    </script>

</body>

</html>
