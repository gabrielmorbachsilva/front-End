<!DOCTYPE html>
<html>

<head>
  <meta charset=“UTF-8”>
  <meta name=“viewport” content=“width=device-width, initial-scale=1.0”>
  <title>Document</title>
</head>

<body>
  <script>
    let dia = prompt("Digite o dia da semana: ");

    // Estrutura de teste para uma variavel de diversos resultados
    switch (dia) {
      case "segunda-feira":
        alert("Inicio da semana!");
        break;
      case "quarta-feira":
        alert("Meio da semana!");
        break;
      case "sexta-feira":
        alert("Fim de semana chegando!");
        break;
      default:
        alert("Dia comum.");
    }
    // Saída: Meio da semana!
    </script>

</body>

</html>
