<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Janelas modais</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
            <h1>Trabalhando com modais</h1>
            <button id="abrir modal">Abrir modal</button>
    </div>
    <!--Fundo escuro-->

        <!--Janela normal-->
        <div class="modal">
            <h2>Janela modal</h2>
            <p>
                Essa é uma janela modal criada com HTML, CSSS e JavaScript.
            </p>
            <button id="fecharModal">Fechar</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
