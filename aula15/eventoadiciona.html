<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial;
            background: #f4f4f4;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }
        .container {
            background: white;
            width: 400px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: royalblue;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.02);
        }

        ul {
            margin-top: 30px;
            list-style: none;
        }

        li {
            background: #eee;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        li:hover {
            background: crimson;
            color: white;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Lista de Tarefas</h1>
        <input type="text" id="tarefa" placeholder="Digite uma tarefa">
        <button onclick="adicionar()">
            Adicionar Tarefa
        </button>
        <ul id="lista"></ul>
    </div>
    <script>
        function adicionar() {
            // pega o texto digitado
            let texto = document.getElementById("tarefa").value;
            // verifica se está vazio
            if(texto == "") {

                alert("Digite uma tarefa");

                return;
            }
            // cria item da lista
            let item = document.createElement("li");
            item.innerHTML = texto;
            // remove ao clicar
            item.onclick = function() {
                item.remove();
            }
            // adiciona na lista
            document.getElementById("lista").appendChild(item);
            // limpa o campo
            document.getElementById("tarefa").value = "";
        }
    </script>

</body>
</html>
