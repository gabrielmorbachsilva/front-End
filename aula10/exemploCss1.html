<!DOCTYPE html>
<html>

<head>
  <meta charset=“UTF-8”>
  <meta name=“viewport” content=“width=device-width, initial-scale=1.0”>
  <title>Exemplo font-weight</title>

  <style>
/*Primeiro arquivo*/
    .normal {
        font-weight: normal;
    }
    .bold {
        font-weight: bold;
    }

    /*Valores numericos*/
    .w100 { font-weight: 100;}
    .w200 { font-weight: 200;}
    .w300 { font-weight: 300;}
    .w400 { font-weight: 400;} /*Normal*/
    .w500 { font-weight: 500;}
    .w600 { font-weight: 600;}
    .w700 { font-weight: 700;} /*Bold*/
    .w800 { font-weight: 800;}
    .w900 { font-weight: 900;}

  </style>
</head>
  
  <body>
     <div class = "Container"></div>
      <h1>Exemplo de fonte-weight</h1>
      <h2>Valores basicos</h2>
      <p class="normal">Texto com font-weight: normal</p>
      <p class="bold">Texto com font-weight: bold</p>
      <p class="lighter">Texto com font-weight: lighter</p>
      <h2>Valores númericos</h2>
      <p class="100">Peso 100 (muito fino)</p>
      <p class="200">Peso 200</p>
      <p class="300">Peso 300</p>
      <p class="400">Peso 400 (normal)</p>
      <p class="500">Peso 500</p>
      <p class="600">Peso 600</p>
      <p class="700">Peso 700 (Negrito)</p>
      <p class="800">Peso 800</p>
      <p class="900">Peso 900 (Espesso)</p>
  </body>
</html>
