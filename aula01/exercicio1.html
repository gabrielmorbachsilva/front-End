<!Doctype html>
<html lang="eng">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width", initial-scala="1.0">
    <title>Document</title>
</head>

<body>
    <script>
        var num = Number(prompt("Digite um número: ")) // recebe valor
        var viz1 = num - 1; // anterior
        var viz2 = num + 1; // posterior
        alert("Os vizinhos do valor " + num + " são: " + viz1 + " " + viz2) // informa vizinhos
    </script>
</body>

</html>
