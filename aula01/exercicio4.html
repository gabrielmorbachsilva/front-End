<!Doctype html>
<html lang="eng">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width", initial-scala="1.0">
    <title>Document</title>
</head>

<body>
    <script>
        var nota1 = Number(prompt("Digite a primeira nota: ")) // recebe valor da primeira nota
        var nota2 = Number(prompt("Digite a segunda nota: ")) // recebe valor da segunda nota
        var media = (nota1 + nota2) / 2; //calculo de média
        alert("1° Nota: " + nota1 + "\n2° Nota: " + nota2 + "\nMédia das notas: " +media) // exibi resultado da média
    </script>
</body>

</html>
