<!Doctype html>
<html lang="eng">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width", initial-scala="1.0">
    <title>Document</title>
</head>

<body>
    <script>
        var jantar = Number(prompt("Valor do jantar: "))
        var garçom = jantar * 10 / 100;
        var total = jantar + garçom;
        alert("Taxa do garçom: R$" + garçom.toFixed(2) + "\nTotal a pagar: R$" + total.toFixed(2));
    </script>
</body>

</html>
