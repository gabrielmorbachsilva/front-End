<!Doctype html>
<html lang="eng">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width", initial-scala="1.0">
    <title>Document</title>
</head>

<body>
    <script>
        var dias = Number(prompt("Dias de viagem: ")) // recebe os dias
        var horas = Number(prompt("Horas de viagem: ")) // recebe as horas
        var total = dias * 24 + horas; // calcula o total
        alert("Tempo total: " + total + " horas.") // exibe resultado
    </script>
</body>

</html>
