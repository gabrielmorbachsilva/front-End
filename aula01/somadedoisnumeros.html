<!Doctype html>
<html lang="eng">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width", initial-scala="1.0">
    <title>Document</title>
</head>

<body>
    <script>
        var num1 = prompt("Informe o primeiro número da soma: ") // recebe primeiro valor
        var num2 = prompt("Informe o segundo número da soma: ") // recebe segundo valor
        var soma = Number(num1) + Number(num2); // soma dos valores
        alert("A soma dos dois números é igual a: " + soma) // exibir resultado
    </script>
</body>

</html>
