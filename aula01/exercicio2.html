<!Doctype html>
<html lang="eng">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width", initial-scala="1.0">
    <title>Document</title>
</head>

<body>
    <script>
        var conta = Number(prompt("Digite valor da conta: ")) // recebe valor conta
        var clientes = Number(prompt("Número de clientes: ")) // recebe número de clientes
        var valorFinal = conta / clientes; // calculo de divisão
        // exibir valor final
        alert("O valor total por pessoa a ser pago é igual a: R$ " + valorFinal.toFixed(2) + 
        "\nNumero de pessoas: " +clientes+ 
        "\nValor da conta: R$ " +conta.toFixed(2))
    </script>
</body>

</html>
