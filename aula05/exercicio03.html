  <meta name=“viewport” content=“width=device-width, initial-scale=1.0”>
  <title>Document</title>

<body>
  <script>
    let numero = Number(prompt("Digite o número que deseja realizar a tabuada: "));

    for(let i=1;i<numero + 1;i++){
    let tabuada = numero * i;
   document.write("A tabuada do número " +numero+ " é: " + tabuada + "<br>");
    }
    </script>

</body>
