<body>
  <script>
    let media = 0;
    let nota = 0;

  for(let i=1;i<11;i++){
     nota = nota + Number(prompt("Digite a nota do " +i+ "° aluno"));
   
  }
   media = nota / 10;
   alert("O média dos alunos é "+ media);
    </script>
