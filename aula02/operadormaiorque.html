  <script>
    // lê um dado de entrada
    var num1 = Number(prompt("Digite um número: "));
    var num2 = Number(prompt("Digite outro número: "));

    alert("O número um (" + num1 + ") é maior que o número dois (" + num2 + ") : " +(num1 > num2));
    </script>
