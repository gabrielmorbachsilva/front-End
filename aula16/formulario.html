<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário com onclick</title>
    <link rel="stylesheet" href="styleforms.css">
</head>
<body>
    <div class="formulario">
        <h2>Formulário</h2>
        <input type="text" id="nome" placeholder="Digite o seu nome">
        <button onclick="mostrar()">Mostrar Nome</button>
    </div>
    <script>
        function mostrar() {
            //seleciona o nome
            let nome = document.getElementById("nome").value;
            //Mostrar nome
            alert("Nome digitado: " + nome);
        }
    </script>

</body>
</html>
